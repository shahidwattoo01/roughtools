server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Gzip compression ─────────────────────────────────
    gzip on;
    gzip_types
      text/plain
      text/css
      text/javascript
      application/javascript
      application/json
      application/xml
      application/xml+rss+xml
      image/svg+xml
      image/webp
      font/woff2;
    gzip_min_length 256;
    gzip_comp_level 6;

    # ─── Static asset caching ───────────────────────────────
    location ~*.(js|css|woff2|woff|svg|png|jpg|webp|ico|json|xml|txt)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ─── HTML files — no cache for SPA ──────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ─── Security headers ──────────────────────────────────
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "camera=(); microphone=(); geolocation=()";
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' https: data: blob:; script-src 'self' https://pagead2.googlesyndication.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;";
}