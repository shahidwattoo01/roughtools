name: Deploy
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: "staging or production"
        required: true
        type: choice
        options:
          - staging
          - production
      rollback:
        description: "Set true to rollback to previous image"
        required: false
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy API
        run: |
          docker pull ghcr.io/${{ github.repository }}/api:${{ github.event.inputs.rollback == 'true' && 'previous' || github.sha }}.latest || true
          docker tag ghcr.io/${{ github.repository }}/api:${{ github.event.inputs.environment }} ghcr.io/${{ github.repository }}/api:latest
          docker push ghcr.io/${{ github.repository }}/api:${{ github.event.inputs.environment }}
        env:
          DEPLOY_TARGET: ${{ github.event.inputs.environment }}

      - name: Deploy Web
        run: |
          docker pull ghcr.io/${{ github.repository }}/web:${{ github.event.inputs.rollback == 'true' && 'previous' || github.sha }}.latest || true
          docker tag ghcr.io/${{ github.repository }}/web:${{ github.event.inputs.environment }} ghcr.io/${{ github.repository }}/web:latest
          docker push ghcr.io/${{ github.repository }}/web:${{ github.event.inputs.environment }}
        env:
          DEPLOY_TARGET: ${{ github.event.inputs.environment }}

      - name: Run database migrations
        if: ${{ github.event.inputs.environment == 'production' && github.event.inputs.rollback != 'true' }}
        run: |
          echo "Migrations would run here via SSH to production server"
          echo "prisma migrate deploy"
        env:
          DEPLOY_TARGET: ${{ github.event.inputs.environment }}

      - name: Notify deployment
        if: always()
        run: |
          echo "Deployment to ${{ github.event.inputs.environment }} completed"
          echo "Image tag: ${{ github.sha }}"
          echo "Rollback: ${{ github.event.inputs.rollback }}"
